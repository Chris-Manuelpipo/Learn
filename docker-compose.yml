services:
  db:
    image: postgres:16-alpine
    container_name: learn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn
    ports:
      - "5440:5432"
    volumes:
      - learn-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  learn-db-data:
